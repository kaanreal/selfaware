name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge, neoforge, quilt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/build.py --loader '${{ matrix.loader }}'
      - uses: actions/upload-artifact@v4
        with:
          name: selfaware-${{ matrix.loader }}
          path: |
            build/*-${{ matrix.loader }}/libs/*.jar
            !build/*-${{ matrix.loader }}/libs/*-sources.jar
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: selfaware-*
          path: release-artifacts
          merge-multiple: true
      - name: Upload GitHub release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          find release-artifacts -type f -name '*.jar' ! -name '*-sources.jar' -print0 \
            | xargs -0 gh release upload "$RELEASE_TAG" --clobber
      - name: Publish every target to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: >-
          python3 scripts/publish_modrinth.py
          --artifacts release-artifacts
          --version "${{ github.event.release.tag_name }}"
