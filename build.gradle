buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'org.ow2.asm:asm-tree:9.9' }
}

def target = gradle.ext.target
def modern = target.minecraft.startsWith('26.')
def neoGradle = modern && target.loader == 'neoforge'

version = providers.gradleProperty('mod_version').get()
group = 'dev.kaan'
base.archivesName = "selfaware-${target.id}"
def clientRun = gradle.startParameter.taskNames.any { it.split(':').last() == 'runClient' }
layout.buildDirectory = clientRun ? file('build') : file("build/${target.id}")

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.neoforged.net/releases/' }
    maven { url = 'https://maven.quiltmc.org/repository/release/' }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.toVersion(target.java)
    targetCompatibility = JavaVersion.toVersion(target.java)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = target.java
}
tasks.withType(JavaExec).configureEach {
    if (name == 'runClient') {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(target.java)
        }
    }
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def textDisplays = !(target.minecraft in ['1.16.5', '1.18.2', '1.19.2'])
def formatAdapter = target.minecraft == '1.21.8' ? 'drawvoid'
        : target.minecraft == '26.2' ? 'submit26'
        : target.minecraft.startsWith('26.') ? 'submit261'
        : target.minecraft in ['1.21.10', '1.21.11'] ? 'submit'
        : 'draw'
def formattingMixins = textDisplays ? ', "TextDisplayAccessor", "NameTagFormattingMixin"' : ''
if (target.minecraft == '1.21.1') formattingMixins += ', "TabOverlayAccessor", "TextDisplay21Accessor", "Display21Accessor", "PlayerRendererMixin"'
sourceSets.main.java.srcDirs = ['src/main/java', "src/adapters/${target.adapter}/java"]
sourceSets.main.java.srcDir "src/adapters/formatting/${textDisplays ? 'display' : 'no-display'}/java"
if (textDisplays) sourceSets.main.java.srcDir "src/adapters/formatting/${formatAdapter}/java"
if (target.minecraft == '1.21.1') sourceSets.main.java.srcDir 'src/adapters/formatting/scoreboard21/java'
if (target.minecraft == '1.21.1') sourceSets.test.java.srcDir 'src/adapters/formatting/scoreboard21/test'
sourceSets.main.java.srcDir "src/adapters/donut-money/${target.minecraft == '1.21.1' ? 'enabled' : 'disabled'}/java"
def menuAdapter = target.minecraft == '1.16.5' ? 'menu16'
        : target.minecraft in ['1.18.2', '1.19.2'] ? 'menu18'
        : target.minecraft == '1.19.4' ? 'menu19'
        : target.minecraft.startsWith('26.1') ? 'menu261'
        : target.minecraft.startsWith('26.') ? 'menu26'
        : target.minecraft == '1.20.1' ? 'menu20'
        : 'menu21'
sourceSets.main.java.srcDir "src/adapters/menu/${menuAdapter}/java"
if (target.loader in ['fabric', 'quilt']) {
    sourceSets.main.java.srcDir 'src/adapters/modmenu/java'
}
def voicechatAdapter = target.minecraft == '1.21.1' ? 'partial'
        : target.minecraft == '1.21.10' ? 'modern2110'
        : target.minecraft == '1.21.11' ? 'modern2111'
        : target.minecraft.startsWith('26.1') ? 'modern261'
        : target.minecraft.startsWith('26.') ? 'modern26'
        : target.adapter == 'modern' ? 'modern'
        : 'legacy'
sourceSets.main.java.srcDir "src/adapters/voicechat/${voicechatAdapter}/java"
sourceSets.main.java.srcDir target.minecraft == '26.2' ? 'src/adapters/hud/java' : 'src/adapters/options/java'
if (target.loader in ['forge', 'neoforge']) {
    sourceSets.main.java.srcDir "src/loaders/${target.loader}/java"
}
sourceSets.main.resources.srcDirs = ['src/main/resources', "src/loaders/${target.loader}/resources"]

def needsRefmap = !modern && (target.loader in ['fabric', 'quilt'] || (target.loader == 'forge' && target.java < 21))
if (!neoGradle) {
    loom {
        mods {
            selfaware {
                sourceSet sourceSets.main
            }
        }
        if (!modern) {
            silentMojangMappingsLicense()
            if (needsRefmap) {
                mixin {
                    useLegacyMixinAp = true
                    defaultRefmapName = 'selfaware.refmap.json'
                }
            }
        }
        if (target.loader == 'forge') {
            forge { mixinConfig 'selfaware.mixins.json' }
        }
        runs {
            client {
                runDir "run/${target.id}"
                if (providers.gradleProperty('smoke').isPresent()) {
                    vmArg '-Dmixin.debug.export=true'
                }
            }
        }
    }
} else {
    runs {
        client {
            client()
            modSource sourceSets.main
            workingDirectory file("run/${target.id}")
            if (providers.gradleProperty('smoke').isPresent()) {
                systemProperty 'mixin.debug.export', 'true'
            }
        }
    }
}

dependencies {
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.20'
    if (target.loader in ['fabric', 'quilt']) {
        def modMenuVersions = [
                '1.16.5': '1.16.23',
                '1.18.2': '3.2.5',
                '1.19.2': '4.2.0-beta.2',
                '1.19.4': '6.3.1',
                '1.20.1': '7.2.2',
                '1.20.2': '8.0.1',
                '1.20.4': '9.2.0',
                '1.20.6': '10.0.0',
                '1.21.1': '11.0.4',
                '1.21.3': '12.0.1',
                '1.21.4': '13.0.4',
                '1.21.5': '14.0.2',
                '1.21.8': '15.0.2',
                '1.21.10': '16.0.1',
                '1.21.11': '17.0.1-beta.1',
                '26.1': '18.0.1',
                '26.2': '20.0.2'
        ]
        def modMenuVersion = modMenuVersions[target.minecraft]
        if (modMenuVersion == null) {
            throw new GradleException("No Mod Menu version is configured for ${target.minecraft}")
        }
        if (modern) implementation "maven.modrinth:modmenu:${modMenuVersion}"
        else modCompileOnly "maven.modrinth:modmenu:${modMenuVersion}"
    }
    def svcVersion = providers.gradleProperty('svcVersion').orNull
    if (svcVersion) {
        if (neoGradle) {
            runtimeOnly "maven.modrinth:simple-voice-chat:${svcVersion}"
        } else if (target.loader in ['fabric', 'quilt']) {
            modLocalRuntime "maven.modrinth:simple-voice-chat:${svcVersion}"
        } else {
            modRuntimeOnly "maven.modrinth:simple-voice-chat:${svcVersion}"
        }
    }
    if (neoGradle) {
        implementation "net.neoforged:neoforge:${target.loaderVersion}"
    } else {
        minecraft "com.mojang:minecraft:${target.minecraft}"
        if (!modern) mappings loom.officialMojangMappings()
        if (target.loader in ['fabric', 'quilt']) {
            def coordinate = target.loader == 'fabric' ? 'net.fabricmc:fabric-loader' : 'org.quiltmc:quilt-loader'
            if (modern) implementation "${coordinate}:${target.loaderVersion}"
            else modImplementation "${coordinate}:${target.loaderVersion}"
        } else if (target.loader == 'forge') {
            forge "net.minecraftforge:forge:${target.minecraft}-${target.loaderVersion}"
        } else {
            neoForge "net.neoforged:neoforge:${target.loaderVersion}"
        }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testImplementation 'de.maxhenkel.voicechat:voicechat-api:2.6.20'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

test { useJUnitPlatform() }
processResources {
    def values = [version: project.version, minecraft: target.minecraft, java: target.java,
                  formattingMixins: formattingMixins,
                  loaderVersion: target.loaderVersion, refmap: needsRefmap ? '"refmap": "selfaware.refmap.json",' : '']
    inputs.properties(values)
    filesMatching(['fabric.mod.json', 'quilt.mod.json', 'META-INF/*.toml', 'selfaware.mixins.json']) { expand(values) }
    if (target.loader == 'neoforge' && target.minecraft in ['1.20.2', '1.20.4']) {
        rename 'neoforge.mods.toml', 'mods.toml'
    }
}
jar {
    if (target.loader == 'forge') manifest.attributes('MixinConfigs': 'selfaware.mixins.json')
}

// Check the actual mapped game method even on loaders without a Mixin annotation processor.
tasks.register('verifyMixinTarget') {
    dependsOn compileJava
    doLast {
        def path = 'net/minecraft/client/renderer/entity/LivingEntityRenderer.class'
        def descriptor = target.adapter == 'legacy' ? '(Lnet/minecraft/world/entity/LivingEntity;)Z' : '(Lnet/minecraft/world/entity/LivingEntity;D)Z'
        def found = false
        configurations.compileClasspath.files.findAll { it.name.endsWith('.jar') }.each { file ->
            new java.util.zip.ZipFile(file).withCloseable { zip ->
                def entry = zip.getEntry(path)
                if (entry != null) {
                    def node = new org.objectweb.asm.tree.ClassNode()
                    zip.getInputStream(entry).withCloseable { stream ->
                        new org.objectweb.asm.ClassReader(stream).accept(node, org.objectweb.asm.ClassReader.SKIP_CODE)
                    }
                    found = node.methods.any { it.name == 'shouldShowName' && it.desc == descriptor }
                }
            }
        }
        if (!found) throw new GradleException("Renderer injection target missing for ${target.id}")
    }
}
check.dependsOn verifyMixinTarget

tasks.register('verifyFormattingTargets') {
    dependsOn compileJava
    doLast {
        def entity = 'net/minecraft/client/renderer/entity/EntityRenderer'
        def feature = 'net/minecraft/client/renderer/feature/NameTagFeatureRenderer'
        def display = 'net/minecraft/world/entity/Display$TextDisplay'
        def classes = [:].withDefault { [] }
        configurations.compileClasspath.files.findAll { it.name.endsWith('.jar') }.each { file ->
            new java.util.zip.ZipFile(file).withCloseable { zip ->
                [entity, feature, display].each { path ->
                    def entry = zip.getEntry(path + '.class')
                    if (entry != null) {
                        def node = new org.objectweb.asm.tree.ClassNode()
                        zip.getInputStream(entry).withCloseable { stream ->
                            new org.objectweb.asm.ClassReader(stream).accept(node, 0)
                        }
                        classes[path] << node
                    }
                }
            }
        }
        def nameMethod = target.adapter == 'legacy' ? 'render' : 'getNameTag'
        assert classes[entity].any { node ->
            node.methods.any { method ->
                method.name == nameMethod && method.instructions.any { instruction ->
                    instruction instanceof org.objectweb.asm.tree.MethodInsnNode &&
                            instruction.owner == 'net/minecraft/world/entity/Entity' && instruction.name == 'getDisplayName'
                }
            }
        }: "Name formatting target missing for ${target.id}"
        if (textDisplays) {
            ['getText', 'getFlags', 'getBackgroundColor'].each { name ->
                assert classes[display].any { node -> node.methods.any { it.name == name && it.desc.startsWith('()') } }
            }
            def renderer = formatAdapter.startsWith('draw') ? entity : feature
            def methodName = formatAdapter.startsWith('draw') ? 'renderNameTag'
                    : formatAdapter == 'submit26' ? 'prepareText'
                    : formatAdapter == 'submit261' ? 'renderTranslucent' : 'render'
            def fontMethod = formatAdapter == 'submit26' ? 'prepareText' : 'drawInBatch'
            assert classes[renderer].any { node ->
                node.methods.any { method ->
                    method.name == methodName && method.instructions.any { instruction ->
                        instruction instanceof org.objectweb.asm.tree.MethodInsnNode &&
                                instruction.owner == 'net/minecraft/client/gui/Font' && instruction.name == fontMethod
                    }
                }
            }: "Name appearance target missing for ${target.id}"
        }
    }
}
check.dependsOn verifyFormattingTargets
